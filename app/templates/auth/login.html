{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="auth-card glass-card p-5">
        <div class="text-center mb-4">
          <div class="auth-logo mb-3">
            <i class="bi bi-heart-fill text-danger display-4"></i>
          </div>
          <h2 class="fw-800">Welcome Back</h2>
          <p class="text-muted">Sign in to continue your impact</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" novalidate id="loginForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label class="form-label fw-600" for="email">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control bg-dark border-secondary text-white"
                     id="email" name="email" required autocomplete="email"
                     placeholder="you@example.com"/>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-600" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control bg-dark border-secondary text-white"
                     id="password" name="password" required autocomplete="current-password"
                     placeholder="••••••••"/>
              <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="mb-4 d-flex justify-content-between align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember"/>
              <label class="form-check-label text-muted" for="remember">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 btn-lg fw-600" id="loginBtn">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

        <hr class="my-4 border-secondary"/>
        <p class="text-center text-muted mb-0">
          Don't have an account?
          <a href="{{ url_for('auth.register') }}" class="text-success fw-600">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('togglePwd').addEventListener('click', function() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    pwd.type = 'password';
    icon.className = 'bi bi-eye';
  }
});
</script>
{% endblock %}
