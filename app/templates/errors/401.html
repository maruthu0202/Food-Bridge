{% extends "base.html" %}
{% block title %}Unauthorized (401){% endblock %}
{% block content %}
<div class="container-xl text-center py-5">
  <h1 class="display-1 fw-800 text-info">401</h1>
  <h3 class="fw-700 mb-3">Authentication Required</h3>
  <p class="text-muted mb-4">Please log in to access this resource.</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i> Log In</a>
</div>
{% endblock %}
